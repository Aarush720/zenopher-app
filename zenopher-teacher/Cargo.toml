[package]
name = "zenopher-teacher"
version = "0.1.0"
edition = "2021"
description = "The Zenopher teacher: rules, measurements, findings, fixes. Pure Rust, compiles into the engine WASM."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
